server:
  port: ${PORT:8085}

spring:
  datasource:
    url: jdbc:h2:mem:gramincareersetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: simple

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/gramin-career-setu}

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    com.gramincareersetu: DEBUG

app:
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    max-requests-per-minute: ${RATE_LIMIT_MAX_PER_MINUTE:100}
