server:
  port: ${PORT:8085}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:${DATABASE_HOST:localhost}}:${MYSQL_PORT:${DATABASE_PORT:3306}}/${MYSQL_DATABASE:${DATABASE_NAME:gramin_career_setu}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER:${DATABASE_USER:root}}
    password: ${MYSQL_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: simple

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/gramin-career-setu}

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.gramincareersetu: INFO
