<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="200" cy="150" r="120" fill="#ECFDF5" />
  
  <!-- Green Rolling Hills in Background -->
  <path d="M40,250 Q120,200 200,230 Q280,260 360,220 L360,280 L40,280 Z" fill="#A7F3D0" opacity="0.6" />
  <path d="M20,270 Q140,220 240,250 Q320,270 380,240 L380,290 L20,290 Z" fill="#6EE7B7" opacity="0.8" />

  <!-- Upward Career Growth Arrow (Main Feature) -->
  <g filter="url(#arrowGlow)">
    <path d="M120,220 L270,110 L255,100 L320,85 L305,150 L290,135 L145,240 Z" fill="url(#arrowGrad)" />
  </g>

  <!-- Student 1 (Left - Female student with folder/book in green salwar) -->
  <g transform="translate(90, 120)">
    <!-- Head -->
    <circle cx="30" cy="25" r="16" fill="#D97706" />
    <path d="M14,22 Q30,6 46,22 Q30,12 14,22 Z" fill="#1E293B" />
    <!-- Body -->
    <path d="M14,46 L46,46 L42,110 L18,110 Z" fill="#059669" />
    <!-- Book -->
    <rect x="24" y="60" width="18" height="24" rx="3" fill="#3B82F6" />
  </g>

  <!-- Student 2 (Center - Male student with shirt & trousers celebrating) -->
  <g transform="translate(170, 95)">
    <!-- Head -->
    <circle cx="30" cy="25" r="16" fill="#D97706" />
    <path d="M15,18 Q30,8 45,18 Q30,14 15,18 Z" fill="#1E293B" />
    <!-- Body -->
    <path d="M15,45 L45,45 L45,95 L15,95 Z" fill="#FBBF24" />
    <!-- Legs -->
    <rect x="18" y="95" width="10" height="45" rx="3" fill="#1E293B" />
    <rect x="32" y="95" width="10" height="45" rx="3" fill="#1E293B" />
  </g>

  <!-- Student 3 (Right - Young boy holding notebook looking up) -->
  <g transform="translate(245, 130)">
    <!-- Head -->
    <circle cx="25" cy="22" r="14" fill="#D97706" />
    <path d="M12,18 Q25,8 38,18 Q25,12 12,18 Z" fill="#1E293B" />
    <!-- Body -->
    <path d="M12,40 L38,40 L36,100 L14,100 Z" fill="#047857" />
    <!-- Notebook -->
    <rect x="18" y="55" width="16" height="20" rx="2" fill="#FFFFFF" stroke="#CBD5E1" />
  </g>

  <!-- Small Trees on baseline -->
  <g transform="translate(50, 215)">
    <circle cx="15" cy="15" r="14" fill="#059669" />
    <rect x="12" y="25" width="6" height="15" fill="#78350F" />
  </g>
  <g transform="translate(325, 205)">
    <circle cx="15" cy="15" r="16" fill="#10B981" />
    <rect x="12" y="27" width="6" height="15" fill="#78350F" />
  </g>
</svg>
