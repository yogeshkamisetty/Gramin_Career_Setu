server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: gramin-career-setu-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.gramincareersetu: DEBUG
    org.springframework.security: INFO

app:
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    max-requests-per-minute: ${RATE_LIMIT_MAX_PER_MINUTE:30}
