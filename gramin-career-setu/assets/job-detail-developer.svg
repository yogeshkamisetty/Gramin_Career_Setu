<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Background Bubble -->
  <circle cx="200" cy="150" r="115" fill="#F0FDF4" />

  <!-- Coding Desk -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="280" height="12" rx="4" fill="url(#deskGrad)" />
    <!-- Desk legs -->
    <rect x="25" y="12" width="8" height="60" rx="2" fill="#94A3B8" />
    <rect x="245" y="12" width="8" height="60" rx="2" fill="#94A3B8" />
  </g>

  <!-- Laptop / Monitor on Desk -->
  <g transform="translate(140, 100)">
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="120" height="85" rx="6" fill="url(#monitorGrad)" />
    <!-- Screen -->
    <rect x="6" y="6" width="108" height="73" rx="3" fill="url(#screenGrad)" />
    <!-- Code Editor Mockup on Screen -->
    <rect x="12" y="14" width="30" height="4" rx="2" fill="#38BDF8" />
    <rect x="12" y="24" width="60" height="3" rx="1.5" fill="#A7F3D0" />
    <rect x="22" y="32" width="45" height="3" rx="1.5" fill="#FDE047" />
    <rect x="22" y="40" width="70" height="3" rx="1.5" fill="#F87171" />
    <rect x="12" y="48" width="50" height="3" rx="1.5" fill="#FFFFFF" />
    <!-- Monitor Stand -->
    <rect x="52" y="85" width="16" height="18" fill="#64748B" />
    <rect x="35" y="100" width="50" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Developer Silhouette / Character on Left -->
  <g transform="translate(85, 110)">
    <!-- Head -->
    <circle cx="25" cy="22" r="15" fill="#D97706" />
    <!-- Glasses -->
    <circle cx="20" cy="22" r="5" fill="none" stroke="#0F172A" stroke-width="2" />
    <circle cx="30" cy="22" r="5" fill="none" stroke="#0F172A" stroke-width="2" />
    <line x1="25" y1="22" x2="25" y2="22" stroke="#0F172A" stroke-width="2" />
    <!-- Hair -->
    <path d="M10,18 Q25,6 40,18 Q25,12 10,18 Z" fill="#1E293B" />
    <!-- Body (Green hoodie/shirt) -->
    <path d="M10,40 L40,40 L46,90 L4,90 Z" fill="#059669" />
    <!-- Hands typing -->
    <path d="M40,60 L75,78" stroke="#D97706" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Potted Plant on Right of Desk -->
  <g transform="translate(280, 150)">
    <!-- Pot -->
    <polygon points="10,50 30,50 26,30 14,30" fill="#E11D48" />
    <!-- Leaves -->
    <path d="M20,30 Q10,10 5,0 Q20,10 20,30 Z" fill="#059669" />
    <path d="M20,30 Q30,10 35,0 Q20,10 20,30 Z" fill="#10B981" />
  </g>

  <!-- Coffee Mug on Desk -->
  <g transform="translate(115, 185)">
    <rect x="0" y="0" width="12" height="15" rx="2" fill="#F59E0B" />
    <path d="M12,4 C16,4 16,11 12,11" fill="none" stroke="#F59E0B" stroke-width="2" />
  </g>
</svg>
