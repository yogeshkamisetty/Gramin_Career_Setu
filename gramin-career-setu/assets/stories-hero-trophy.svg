<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CA8A04" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="200" cy="140" r="115" fill="#FEFCE8" />
  <circle cx="200" cy="140" r="95" fill="#FEF9C3" opacity="0.6" />

  <!-- Podium / Base -->
  <g transform="translate(130, 205)">
    <rect x="0" y="15" width="140" height="25" rx="5" fill="#065F46" />
    <rect x="10" y="0" width="120" height="18" rx="4" fill="url(#podiumGrad)" />
    <!-- 1st Rank Star on Podium -->
    <circle cx="70" cy="9" r="6" fill="#FEF08A" />
  </g>

  <!-- Golden Trophy Cup (Main Subject) -->
  <g transform="translate(145, 60)" filter="url(#trophyGlow)">
    <!-- Left Handle -->
    <path d="M25,35 C-5,35 -5,75 25,85" fill="none" stroke="url(#goldTrophy)" stroke-width="9" stroke-linecap="round" />
    <!-- Right Handle -->
    <path d="M85,35 C115,35 115,75 85,85" fill="none" stroke="url(#goldTrophy)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Cup Body -->
    <path d="M20,20 L90,20 L80,95 Q55,120 30,95 Z" fill="url(#goldTrophy)" />
    <!-- Rim top -->
    <ellipse cx="55" cy="20" rx="35" ry="8" fill="#FEF08A" />
    
    <!-- Star on Trophy -->
    <polygon points="55,42 58,52 68,52 60,58 63,68 55,62 47,68 50,58 42,52 52,52" fill="#FFFFFF" />

    <!-- Stem / Neck -->
    <path d="M47,110 L63,110 L60,135 L50,135 Z" fill="url(#goldTrophy)" />
    
    <!-- Base Plate -->
    <rect x="35" y="135" width="40" height="12" rx="3" fill="#B45309" />
  </g>

  <!-- Potted Plants on Left & Right -->
  <!-- Left Plant -->
  <g transform="translate(70, 180)">
    <path d="M20,35 Q0,10 5,-15 Q25,-5 20,35 Z" fill="#059669" />
    <path d="M20,35 Q-15,25 -20,5 Q5,5 20,35 Z" fill="#10B981" />
  </g>
  <!-- Right Plant -->
  <g transform="translate(300, 180)">
    <path d="M10,35 Q30,10 25,-15 Q5,-5 10,35 Z" fill="#059669" />
    <path d="M10,35 Q45,25 50,5 Q25,5 10,35 Z" fill="#34D399" />
  </g>

  <!-- Floating Golden Stars / Confetti -->
  <g transform="translate(80, 70)">
    <polygon points="12,0 15,8 24,12 15,16 12,24 9,16 0,12 9,8" fill="url(#starGrad)" />
  </g>
  <g transform="translate(300, 80)">
    <polygon points="10,0 12,6 18,10 12,14 10,20 8,14 2,10 8,6" fill="url(#starGrad)" />
  </g>
  <g transform="translate(120, 45)">
    <circle cx="5" cy="5" r="4" fill="#FBBF24" />
  </g>
  <g transform="translate(270, 50)">
    <circle cx="5" cy="5" r="5" fill="#FBBF24" />
  </g>
</svg>
