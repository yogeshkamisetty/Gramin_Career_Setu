<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="folderTab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="book1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="book2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="book3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="downloadCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background decorative circle -->
  <circle cx="200" cy="150" r="120" fill="#F0FDF4" />

  <!-- Stack of Books on left -->
  <!-- Book 3 (Bottom red) -->
  <g transform="translate(110, 180)">
    <rect x="0" y="0" width="120" height="22" rx="4" fill="url(#book3Grad)" />
    <rect x="110" y="2" width="8" height="18" rx="2" fill="#FEF2F2" />
    <line x1="15" y1="11" x2="95" y2="11" stroke="#FCA5A5" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Book 2 (Middle blue) -->
  <g transform="translate(100, 154)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="url(#book2Grad)" />
    <rect x="120" y="2" width="8" height="18" rx="2" fill="#EFF6FF" />
    <line x1="15" y1="11" x2="105" y2="11" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Book 1 (Top green) -->
  <g transform="translate(90, 128)">
    <rect x="0" y="0" width="140" height="22" rx="4" fill="url(#book1Grad)" />
    <rect x="130" y="2" width="8" height="18" rx="2" fill="#ECFDF5" />
    <line x1="15" y1="11" x2="115" y2="11" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Open Yellow Resource Folder (Main Focus) -->
  <g transform="translate(170, 70)" filter="url(#softShadow)">
    <!-- Back tab -->
    <path d="M10,20 L60,20 L75,35 L160,35 Q165,35 165,40 L165,150 Q165,155 160,155 L10,155 Q5,155 5,150 L5,25 Q5,20 10,20 Z" fill="url(#folderTab)" />
    
    <!-- White Paper documents inside folder -->
    <rect x="25" y="10" width="120" height="130" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <line x1="40" y1="35" x2="100" y2="35" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="50" x2="130" y2="50" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="65" x2="120" y2="65" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="80" x2="130" y2="80" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />

    <!-- Front Folder Flap (Angled forward) -->
    <path d="M0,55 L170,55 L155,160 Q153,165 148,165 L15,165 Q10,165 8,160 L0,55 Z" fill="url(#folderGrad)" opacity="0.95" />
  </g>

  <!-- Green Download Badge in Center -->
  <g transform="translate(235, 145)" filter="url(#softShadow)">
    <circle cx="28" cy="28" r="26" fill="url(#downloadCircle)" />
    <circle cx="28" cy="28" r="25" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="3 3" />
    <!-- Downward Arrow -->
    <path d="M28,16 L28,34 M20,27 L28,35 L36,27 M19,38 L37,38" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Potted Plant on Right -->
  <g transform="translate(305, 160)">
    <!-- Pot -->
    <path d="M15,50 L35,50 L30,75 L20,75 Z" fill="#94A3B8" />
    <rect x="12" y="46" width="26" height="5" rx="2" fill="#64748B" />
    <!-- Plant Leaves -->
    <path d="M25,46 Q10,30 5,15 Q20,20 25,46 Z" fill="#10B981" />
    <path d="M25,46 Q40,30 45,15 Q30,20 25,46 Z" fill="#059669" />
    <path d="M25,46 Q25,20 25,5 Q30,20 25,46 Z" fill="#34D399" />
  </g>

  <!-- Sparkles -->
  <g transform="translate(75, 80)">
    <polygon points="10,0 12,7 19,10 12,13 10,20 8,13 1,10 8,7" fill="#FBBF24" />
  </g>
  <g transform="translate(325, 85)">
    <polygon points="8,0 10,5 15,8 10,11 8,16 6,11 1,8 6,5" fill="#34D399" />
  </g>
</svg>
