<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBreeze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Background Halo -->
  <circle cx="200" cy="150" r="125" fill="url(#skyBreeze)" />

  <!-- Rashtrapati Bhavan / Parliament Dome & Flag in Background -->
  <g transform="translate(140, 75)">
    <!-- Central Dome -->
    <path d="M40,55 Q60,15 80,55 Z" fill="url(#domeGrad)" />
    <rect x="58" y="10" width="4" height="15" fill="#64748B" />
    <!-- Indian Tiranga Flag on Mast -->
    <rect x="62" y="10" width="20" height="4" fill="#FF9933" />
    <rect x="62" y="14" width="20" height="4" fill="#FFFFFF" />
    <rect x="62" y="18" width="20" height="4" fill="#138808" />
    <circle cx="72" cy="16" r="1.5" fill="#000080" />
    <!-- Pillars Base -->
    <rect x="25" y="55" width="70" height="20" fill="#E2E8F0" />
    <line x1="35" y1="55" x2="35" y2="75" stroke="#94A3B8" stroke-width="2" />
    <line x1="50" y1="55" x2="50" y2="75" stroke="#94A3B8" stroke-width="2" />
    <line x1="70" y1="55" x2="70" y2="75" stroke="#94A3B8" stroke-width="2" />
    <line x1="85" y1="55" x2="85" y2="75" stroke="#94A3B8" stroke-width="2" />
  </g>

  <!-- Wind Turbines & Trees -->
  <g transform="translate(310, 100)">
    <line x1="15" y1="40" x2="15" y2="0" stroke="#CBD5E1" stroke-width="2" />
    <line x1="15" y1="0" x2="5" y2="-15" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="15" y1="0" x2="25" y2="-15" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- Group of 4 Citizens in Foreground -->

  <!-- 1. Rural Youth (Left - Green Polo & Tablet) -->
  <g transform="translate(85, 110)">
    <circle cx="25" cy="25" r="15" fill="#D97706" />
    <path d="M10,20 Q25,8 40,20 Q25,14 10,20 Z" fill="#0F172A" />
    <path d="M10,42 L40,42 L42,110 L8,110 Z" fill="#059669" />
    <!-- Tablet -->
    <rect x="22" y="60" width="22" height="28" rx="2" fill="#1E293B" stroke="#047857" />
  </g>

  <!-- 2. Farmer with Turban & Angavastram (Center-Left) -->
  <g transform="translate(145, 95)">
    <!-- White Turban -->
    <path d="M8,18 Q26,0 44,18 L40,26 L12,26 Z" fill="#FFFFFF" stroke="#E2E8F0" />
    <!-- Face -->
    <circle cx="26" cy="30" r="15" fill="#D97706" />
    <path d="M16,36 Q26,42 36,36" stroke="#451A03" stroke-width="2" fill="none" /> <!-- Moustache -->
    <!-- Green Kurti & Angavastram -->
    <path d="M10,48 L42,48 L44,120 L8,120 Z" fill="#047857" />
    <path d="M14,48 L22,120" stroke="#FFFFFF" stroke-width="4" />
  </g>

  <!-- 3. Female Student in Yellow Kurti with books (Center-Right) -->
  <g transform="translate(205, 110)">
    <circle cx="25" cy="25" r="14" fill="#D97706" />
    <circle cx="25" cy="23" r="1.5" fill="#DC2626" /> <!-- Bindi -->
    <path d="M10,25 Q25,8 40,25 L36,45 L14,45 Z" fill="#1E293B" />
    <path d="M10,42 L40,42 L44,110 L6,110 Z" fill="#F59E0B" />
    <rect x="20" y="60" width="18" height="24" rx="2" fill="#3B82F6" />
  </g>

  <!-- 4. Female Graduate in Green Salwar with Notebook (Right) -->
  <g transform="translate(255, 120)">
    <circle cx="25" cy="25" r="14" fill="#D97706" />
    <path d="M10,25 Q25,8 40,25 L38,50 L12,50 Z" fill="#1E293B" />
    <path d="M10,42 L40,42 L42,105 L8,105 Z" fill="#059669" />
    <rect x="14" y="62" width="20" height="24" rx="2" fill="#1E293B" />
  </g>
</svg>
