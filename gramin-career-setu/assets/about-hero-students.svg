<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Background Halo -->
  <circle cx="200" cy="150" r="125" fill="url(#skyGrad)" />

  <!-- Village Backdrop: Hills, trees and rural cottages -->
  <!-- Green Rolling Hills -->
  <path d="M50,220 Q120,180 200,200 Q280,220 350,190 L350,270 L50,270 Z" fill="#86EFAC" />
  
  <!-- Village Cottage on Left -->
  <g transform="translate(85, 175)">
    <polygon points="25,0 50,18 0,18" fill="url(#roofGrad)" />
    <rect x="5" y="18" width="40" height="25" fill="#FEF3C7" />
    <rect x="20" y="25" width="10" height="18" fill="#78350F" />
  </g>
  <!-- Coconut / Palm Tree on left -->
  <g transform="translate(60, 140)">
    <path d="M15,65 Q18,30 20,0" stroke="#78350F" stroke-width="4" fill="none" />
    <path d="M20,0 Q5,-15 -10,-5" stroke="#059669" stroke-width="3" fill="none" />
    <path d="M20,0 Q35,-15 50,-5" stroke="#059669" stroke-width="3" fill="none" />
    <path d="M20,0 Q20,-25 20,-30" stroke="#10B981" stroke-width="3" fill="none" />
  </g>

  <!-- Village Cottage on Right -->
  <g transform="translate(265, 170)">
    <polygon points="30,0 60,20 0,20" fill="url(#roofGrad)" />
    <rect x="8" y="20" width="44" height="28" fill="#FEF3C7" />
    <rect x="25" y="28" width="10" height="20" fill="#78350F" />
  </g>

  <!-- Group of 3 Rural Youth in Foreground -->

  <!-- Student 1 (Left - Young woman holding books in Green Churidar) -->
  <g transform="translate(115, 100)">
    <!-- Hair & Head -->
    <path d="M12,28 Q26,8 40,28 L36,50 L16,50 Z" fill="#1E293B" />
    <circle cx="26" cy="30" r="14" fill="#F59E0B" />
    <circle cx="26" cy="27" r="1.5" fill="#DC2626" /> <!-- Bindi -->
    <!-- Green Kurti -->
    <path d="M12,48 L40,48 L44,115 L8,115 Z" fill="#059669" />
    <!-- Yellow Dupatta -->
    <path d="M12,48 Q26,75 22,115" stroke="#FBBF24" stroke-width="6" fill="none" />
    <!-- Notebook in hand -->
    <rect x="20" y="65" width="20" height="26" rx="2" fill="#3B82F6" stroke="#2563EB" />
  </g>

  <!-- Student 2 (Center - Young man in Yellow Shirt with backpack straps) -->
  <g transform="translate(170, 75)">
    <!-- Head & Hair -->
    <circle cx="30" cy="30" r="16" fill="#F59E0B" />
    <path d="M14,24 Q30,12 46,24 Q30,18 14,24 Z" fill="#0F172A" />
    <!-- Yellow Shirt -->
    <path d="M12,50 L48,50 L46,125 L14,125 Z" fill="#FBBF24" />
    <!-- Collar & Placket -->
    <polygon points="30,50 24,62 30,68 36,62" fill="#D97706" />
    <!-- Backpack Straps -->
    <line x1="18" y1="52" x2="20" y2="100" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="52" x2="40" y2="100" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Student 3 (Right - Young woman holding folder in Green Saree/Dress) -->
  <g transform="translate(230, 95)">
    <!-- Hair & Head -->
    <path d="M10,32 Q26,10 42,32 L40,65 L12,65 Z" fill="#1E293B" />
    <circle cx="26" cy="30" r="14" fill="#F59E0B" />
    <!-- Dress -->
    <path d="M10,48 L42,48 L46,120 L6,120 Z" fill="#047857" />
    <!-- Black Folder held -->
    <rect x="10" y="68" width="22" height="28" rx="2" fill="#1E293B" />
  </g>
</svg>
